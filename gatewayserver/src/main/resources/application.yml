spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:${config.host}"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 2000ms
  data:
    redis:
      connect-timeout: 1000ms
      host: localhost
      port: 6379
      timeout: 1000ms
config:
  host: "http://localhost:8071"
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true
info:
  app:
    name: "Gateway Server"
    description: "This service routes requests to appropriate microservices."
    version: "1.0.0"
logging:
  level:
    com:
      secure:
        gatewayserver: DEBUG
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000